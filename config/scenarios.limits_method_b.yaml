# Security limits, method b of Note S1 (paper): aggregate curve + per-carrier
# caps on the import share (2026-11-25). Generated by
# text_docs/scripts/build_limit_options.py. Values in MtCO2-eq/yr at the
# wellhead/mine; biomass import in TWh/yr. Merge with a climate path and the
# lever settings.
#
#   aggregate:   fossil_limit_values = L(t)
#                tight   L = max(reference CO2 path, European-safe production)
#                gradual L = max(1.9 C path, European-safe production)
#   per carrier: energy_limit_per_carrier_values = P_c(t) + sigma_c * M(t)
#                M(t) = L(t) - P(t) (total import allowance),
#                sigma_c = (1 + 0.2) x today's import share
#                (gas 21.5 %, oil 69.9 %, hard coal 8.5 %, lignite 0)
#   biomass:     imports 21.5 TWh (2024) x M(t)/M(2025)
#   climate_19:  1.9 C path, Victoria et al. (2022) method, net zero in 2050,
#                as fractions of 1990 (4603.6 MtCO2)

limits_tight_b:
  fossil_limit: true
  fossil_limit_values: {2025: 2983.3, 2030: 2071.8, 2035: 1151.0, 2040: 734.4, 2045: 671.3,
    2050: 613.2}
  energy_limit_per_carrier: true
