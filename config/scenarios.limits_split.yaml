# Security limits (Note S1 of the paper), 2026-11-25: aggregate curve L(t)
# and its split between carriers, two cases. Generated by
# text_docs/scripts/build_limit_options.py. Values in MtCO2-eq/yr at the
# wellhead/mine; biomass import in TWh/yr. Merge with a climate path and the
# lever settings.
#
#   aggregate:   fossil_limit_values = L(t)
#                tight   L = max(reference CO2 path - process CO2, European-safe
#                        production); process CO2 = non-fuel process CO2 of
#                        industry (calcination, ceramics, glass, electrodes)
#                gradual L = max(1.9 C path - process CO2, European-safe production)
#   M(t) = L(t) - P(t): total import allowance (P = European-safe production)
#   *_pace:      same pace for every carrier's imports:
#                energy_limit_per_carrier_values = P_c(t) + sigma_c * M(t),
#                sigma_c = today's import share (gas 21.5 %, oil 69.9 %,
#                hard coal 8.5 %, lignite 0); the limits add up to L exactly
#   *_free:      the model chooses the mix within L:
#                energy_limit_per_carrier_values = P_c(t) + M(t), binding only
#                when M = 0 (autarky per carrier)
#   limits_share_*: old share formulation (curve A); limits_limitcase_ref_*:
#                limit case D1 (kappa = 1, reference path), same two splits
#   *_lulucf_*:  reference path corrected for the shortfall of the LULUCF sink
#                (lulucf_deviation_values: EEA 2026, Member State projections
#                with additional measures); B and D1 re-derived
#   limits_limitcase_19_*, limits_gradual_lulucf_pace: 1.9 C path, curve D2 and
#                C with the LULUCF correction
#   biomass:     imports 21.5 TWh (2024) x M(t)/M(2025)
#   climate_19:  1.9 C path, Victoria et al. (2022) method, net zero in 2050,
#                as fractions of 1990 (4603.6 MtCO2)

