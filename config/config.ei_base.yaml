# yaml-language-server: $schema=schema.default.json
# Base for the energy_independency production runs. Puts back the
# heat_industry defaults that differ from config.default.yaml on this
# upstream-based branch, so the run configs below stay the same as before.
# Layer: config.default.yaml (automatic) -> this file -> run config
#   snakemake --configfile config/config.ei_base.yaml config/config.<run>.yaml
#
# Old format -> new format:
#   scenario: clusters: [50]          -> clustering: cluster_network: n_clusters: 50
#   scenario: sector_opts: [8h]       -> clustering: temporal: averaging: 8h
#   scenario: sector_opts: [1095seg]  -> clustering: temporal: segmentation: 1095
#   scenario: planning_horizons       -> planning_horizons (top level)

foresight: myopic

# Weather year 2024 (includes the January 2024 cold spell). The cutout is
# the pre-built one from the PyPSA data archive (ERA5 + SARAH3). 2024 is a
# leap year: 29 February is dropped (snapshots: drop_leap_day, default).
snapshots:
  start: "2024-01-01 00:00"
  end: "2024-12-31 23:00"

atlite:
  default_cutout: europe-2024-sarah3-era5

planning_horizons:
- 2025
- 2030
- 2035
- 2040
- 2045
- 2050

clustering:
  cluster_network:
    n_clusters: 50

# Lever 3, power grid: base = x1.25 by 2050 at an equal rate per horizon
# (myopic: each value is relative to the previous horizon's grid); the
# hydrogen network is not limited. High case (x1.5) set per scenario.
electricity:
  transmission_limit:
    2025: v1.0
    2030: v1.046
    2035: v1.046
    2040: v1.046
    2045: v1.046
    2050: v1.046

sector:
  enabled: true
  # CDR technologies (on by default on heat_industry)
  afforestation: true
  perennials: true
  rock_weathering: true
  biochar:
    enable: true
    heat_output: waste
  # biomethanation off: never selected in the test runs
  biomethanation_biogas: false
  biomethanation_CO2: false
  # Lever 1, CO2 infrastructure: base profile (PyPSA-Eur default, 250 Mt
  # plateau). High profile = x1.6 (400 Mt plateau), set per scenario.
  # Note: base profile + business-as-usual LULUCF has no solution in 2050.
  co2_sequestration_potential:
    2020: 0
    2025: 0
    2030: 40
    2035: 100
    2040: 180
    2045: 250
    2050: 250
  # Lever 2, land transport: base = PyPSA-Eur default electric shares
  # (5/20/45/70/85/100 %), consistent with the EU 2035 ICE sales ban and a
  # 15-year fleet turnover. Fast case set per scenario.
  # own sector extensions (on by default on heat_industry)
  shipping_endogenous: true
  biomass_transport: true
  # crop cultivation emissions of the unsustainable bioliquids (bioliquids PR)
  unsustainable_biomass_upstream_emissions: true
  industry_heat:
    enable: true
  # solid biomass import cap (TWh/yr), 100 % self-sufficiency in 2050:
  # starts at today's extra-EU imports (21.5 TWh of pellets in 2024) and
  # declines with the total fossil import allowance (import-allowance
  # formulation, text_docs/scripts/build_energy_limit_per_carrier.py).
  # Only used when solid_biomass_import: enable is true.
  solid_biomass_import:
    max_amount:
      2025: 21.5
      2030: 19.3
      2035: 13.9
      2040: 7.6
      2045: 2.2
      2050: 0.0

# heat_industry had fossil_limit on by default; every run config below set it
# explicitly, so it stays off here.
fossil_limit: false
lulucf_deviation: false

solving:
  solver:
    name: gurobi
    options: gurobi-default
  mem_mb: 300000

# 1st-generation bioliquids: available at today's level in every horizon
# (no phase-out), used only if the optimisation wants them (no must-use),
# and their cropland is shared with perennialisation. Their cultivation
# emissions are counted (sector: unsustainable_biomass_upstream_emissions).
biomass:
  # solid biomass of today's use (phased out by 2040) is a maximum
  # potential, not a must-use, like the sustainable solid biomass
  free_use_unsustainable_solid_biomass: true
  unsustainable_bioliquids:
    share_retained:
      2020: 1
      2025: 1
      2030: 1
      2035: 1
      2040: 1
      2045: 1
      2050: 1
    free_use: true
