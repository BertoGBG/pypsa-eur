%YAML 1.1
---
# Overrides layered on top of config.default.yaml via
#   --configfile config/config.default.yaml config/config.nuclear_fix_test_168h.yaml
#
# Fast test of the nuclear double-count fix (uranium fuel-supply gap +
# nuclear removed from pypsa_eur.Generator keep-list -- see commit
# f5d3543b) and the missing-DateOut lifetime decoupling. Mirrors
# config.run1_baseline_50_8h.yaml's settings exactly (50 nodes, myopic,
# nothing of this fork's own additions activated -- no CDR, no LULUCF
# deviation, no endogenous industry/heat/shipping, no fossil_limit) but at
# 168h (weekly) resolution instead of run1's native 8h, and a 3-horizon
# subset (2030/2040/2050) of run1's full 6-horizon list, for a fast
# nuclear-specific turnaround check rather than a full comparison run.
#
# shared_resources kept isolated (policy: false, own resources/ dir) rather
# than pointing at base_myopic_50_8h: that directory's provenance metadata
# is from 2026-08-26, and many rules' code has changed since then (steel/
# cement endogenization, industry fixes, etc.) -- reusing it risks Snakemake
# silently rebuilding-and-overwriting run1's baseline files in place rather
# than just reading them, which would corrupt that reference run. Not worth
# the risk to save a handful of jobs against an already ~50k-deep cluster
# queue (see git log / conversation -- the bottleneck is queue depth, not
# this run's own job count).

run:
  name: "nuclear_fix_test_168h"
  shared_resources:
    policy: false

# config.default.yaml's solving.mem_mb (300000 = 300GB) is sized for full
# production runs (90 clusters, finer resolution, all CDR techs) -- a
# comparable but heavier 90-cluster/168h run (myopic_LULUCF_biometh_test,
# all four CDRs + LULUCF deviation active) peaked at ~10GB actual usage per
# its own memory.log, so 300GB for this smaller/simpler 50-cluster test is
# wildly oversized and mostly just makes the job harder to schedule (few
# nodes have 300GB free). Overridden here only, not in config.default.yaml,
# so production runs keep their real headroom.
solving:
  mem_mb: 30000

scenario:
  clusters:
  - 50
  sector_opts:
  - 168h
  planning_horizons:
  - 2030
  - 2040
  - 2050

fossil_limit: false
lulucf_deviation: false

sector:
  biochar:
    enable: false
  rock_weathering: false
  afforestation: false
  perennials: false
  biomethanation_biogas: false
  biomethanation_CO2: false
  endogenous_sectors:
    enable: false
  industry_t:
    endogen: false
  shipping_endogenous: false
