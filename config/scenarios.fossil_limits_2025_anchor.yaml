# Fossil-supply limits for the next scenario round, anchored in 2025
# (2026-09-30). Only the limit-related overrides; merge into the real
# scenario file together with LULUCF, CDR and other settings.
#
# All curves start from real 2024 consumption in 2025 (Eurostat GIC, UK via
# DESNZ DUKES 1.1.1, see text_docs/literature/eurostat_desnz_GIC_fossil_2024_scope.csv),
# so every target gives the SAME 2025 limit and they only diverge after.
# The 2050 endpoints are unchanged from the weekend batch.
#
# Generated with text_docs/scripts/build_fossil_supply_security.py
# (aggregate) and build_energy_limit_per_carrier.py (per-carrier; 60 % =
# TARGET_SELF_SUFFICIENCY_2050 = 0.6). The per-carrier 100 % values are also
# the config.default.yaml defaults. MtCO2-eq/yr at the wellhead/mine;
# biomass import in TWh/yr.

aggregate_100:
  fossil_limit: true
  fossil_limit_values:
    2025: 2993.2
    2030: 2254.9
    2035: 1368.3
    2040: 942.3
    2045: 718.1
    2050: 613.2
  energy_limit_per_carrier: false

aggregate_60:
  fossil_limit: true
  fossil_limit_values:
    2025: 2993.2
    2030: 2491.3
    2035: 1793.6
    2040: 1411.9
    2045: 1164.6
    2050: 1022.0
  energy_limit_per_carrier: false

per_carrier_100:
