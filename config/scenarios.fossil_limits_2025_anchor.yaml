# Fossil-supply limits anchored in 2025, IMPORT-ALLOWANCE formulation
# (2026-11-24; replaces the self-sufficiency-share formulation of
# 2026-09-30). Only the limit-related overrides; merge into the real
# scenario file together with LULUCF, CDR and other settings.
#
# limit(t) = European-safe production(t) + import allowance(t); the
# allowance moves from today's imports (2024 use minus 2025 secure
# production) to the 2050 target along a smoothstep, so every target gives
# the same 2025 limit (2024 use) and the same 2050 endpoint as before.
# Solid biomass imports start at today's real extra-EU imports (21.5 TWh)
# and decline with the total fossil import allowance.
#
# Generated with text_docs/scripts/build_energy_limit_per_carrier.py
# (per carrier) and build_limits_overview.py (aggregate). MtCO2-eq/yr at
# the wellhead/mine; biomass import in TWh/yr.

